name: one-kilo-infra
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
main: dist/src/main.js
config:
  node-count:
    type: integer
    default: 1
    description: Nodes in the GKE node pool. Set to 0 to park the cluster; only redeploy with an unchanged image-tag while parked, since Deployment rollouts can't finish without nodes.
  cloudflare-tunnel-token:
    type: string
    secret: true
    description: Token for the cloudflared tunnel that fronts the cluster's public ingress.
  postgres-host:
    type: string
  postgres-port:
    type: string
  postgres-ssl:
    type: boolean
    default: true
    description: Require TLS with certificate verification for Postgres connections. Disable only for an in-cluster database.
  postgres-user:
    type: string
  postgres-db:
    type: string
  postgres-password:
    type: string
    secret: true
  web-public-base-url:
    type: string
    description: Public origin (scheme://host) browsers and WorkOS use to reach the web app. Per-stack — must match the Cloudflare tunnel hostname AND a registered WorkOS redirect URI.
  workos-client-id:
    type: string
    description: WorkOS environment client id.
  workos-api-key:
    type: string
    secret: true
    description: WorkOS API key.